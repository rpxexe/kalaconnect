spring.application.name=kalaconnect-backend
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# ===================================================================
# Aiven PostgreSQL / Spring JDBC Configuration
# Values are injected via environment variables:
# DB_URL, DB_USERNAME, DB_PASSWORD
# Never commit actual credentials to version control.
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool & Aiven TLS Settings
spring.datasource.hikari.pool-name=KalaConnectHikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.max-lifetime=1200000
# Defer eager connection failure so health endpoints can report status gracefully if DB is offline
spring.datasource.hikari.initialization-fail-timeout=-1

# Aiven PostgreSQL SSL / TLS connection properties
spring.datasource.hikari.data-source-properties.sslmode=require

# ===================================================================
# Security & JWT Configuration
# ===================================================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ===================================================================
# Logging
# ===================================================================
logging.level.com.kalaconnect=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.springframework.web=INFO

# ===================================================================
# Google Gemini AI Configuration
# Gemini API key exists ONLY on the backend via environment variable.
# Never expose to Android client or frontend code.
# ===================================================================
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.timeout-seconds=25

